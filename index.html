<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>mm Ruler</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruler">
<!-- black-translucent lets the page run under the status bar, so y = 0 is the top edge of the glass -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f6f3e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: one screen. Ruler scale hugs the left edge from the very top of the glass, reading and controls sit to its right. */
:root {
  --bg: #f6f3e8;          /* boxwood ruler face */
  --ink: #1d1f1c;
  --muted: #6b6a5e;
  --line: #d9d3bf;
  --accent: #d2331f;      /* red cursor line, like a drafting cursor */
  --panel: #ffffffb3;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --sans: -apple-system, system-ui, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --ink: #ecebe4; --muted: #9a998f; --line: #34352f;
    --accent: #ff6a52; --panel: #23242699; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px var(--sans);
  overflow: hidden; overscroll-behavior: none;
  touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
}
#ruler { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#info {
  position: absolute;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  pointer-events: none;
}
#reading { font-family: var(--mono); font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
#reading small { font-size: 15px; font-weight: 400; color: var(--muted); margin-left: 4px; }
</style>
</head>
<body>
<canvas id="ruler" aria-label="Millimetre ruler"></canvas>
<div id="info">
  <div id="reading">0.0<small>mm</small></div>
</div>

<script>
(() => {
  // iPhone 17 Pro (Apple tech specs): body 150.0 × 71.9 mm, screen 2622 × 1206 px at 460 ppi, rendered at 3x.
  const NATIVE_PT_WIDTH = 402;
  const BASE_PX_PER_MM = 460 / 3 / 25.4;               // ≈ 6.0367 pt per mm
  const SCREEN_H_MM = 2622 / 460 * 25.4;               // ≈ 144.78 mm of lit screen
  const EDGE_MM = Math.round((150.0 - SCREEN_H_MM) / 2 * 10) / 10; // ≈ 2.6 mm frame + bezel above the screen
  const CORNER_PT = 62;                                // approx. screen corner radius, in points

  // Only a home-screen launch puts y = 0 at the top of the glass; in Safari the toolbar sits above.
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

  // Display Zoom shrinks the logical width (e.g. 375 pt); scale up to match.
  const sw = Math.min(screen.width, screen.height);
  const zoomFactor = (sw >= 320 && sw <= NATIVE_PT_WIDTH) ? NATIVE_PT_WIDTH / sw : 1;

  // Adjustments saved by earlier versions still apply.
  const load = (k, d) => { try { const v = parseFloat(localStorage.getItem(k)); return isNaN(v) ? d : v; } catch (e) { return d; } };
  const cal = load('mmRulerCal', 1);
  const edge = load('mmRulerEdge', EDGE_MM);

  const canvas = document.getElementById('ruler');
  const ctx = canvas.getContext('2d');
  const readingEl = document.getElementById('reading');
  let cursorMm = 50;

  const pxPerMm = () => BASE_PX_PER_MM * zoomFactor * cal;
  const zeroMm = () => standalone ? edge : 0;   // ruler value at the top of the canvas
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  // How far the rounded screen corner eats into the left edge at height y.
  function cornerInset(y, h) {
    if (!standalone) return 0;
    const r = CORNER_PT / zoomFactor;
    const d = Math.min(y, h - y);
    if (d >= r) return 0;
    return r - Math.sqrt(r * r - (r - d) * (r - d)) + 3;
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const ppm = pxPerMm(), z = zeroMm();
    const ink = css('--ink'), accent = css('--accent');
    const half = 0.5 / dpr; // centre 1-device-pixel lines on device pixels

    ctx.fillStyle = ink; ctx.strokeStyle = ink;
    ctx.font = '600 13px ' + css('--mono');
    ctx.textBaseline = 'middle';

    // Half-mm ticks are too dense to read; stick to whole mm.
    for (let mm = Math.ceil(z); (mm - z) * ppm <= h; mm++) {
      const y = Math.round((mm - z) * ppm * dpr) / dpr + half;
      const x0 = cornerInset(y, h);
      const len = mm % 10 === 0 ? 30 : mm % 5 === 0 ? 20 : 12;
      ctx.lineWidth = mm % 10 === 0 ? 1.5 : 1 / dpr * 2;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + len, y); ctx.stroke();
      if (mm % 10 === 0) ctx.fillText(String(mm), x0 + 36, Math.max(y, 8));
    }

    // Cursor
    const cy = (cursorMm - z) * ppm;
    ctx.strokeStyle = accent; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();

    readingEl.innerHTML = cursorMm.toFixed(1) + '<small>mm</small>';
  }

  function moveTo(e) {
    const rect = canvas.getBoundingClientRect();
    const mm = zeroMm() + (e.clientY - rect.top) / pxPerMm();
    cursorMm = Math.max(0, Math.round(mm * 2) / 2); // snap to 0.5 mm
    draw();
  }
  let dragging = false;
  window.addEventListener('pointerdown', e => { dragging = true; moveTo(e); });
  window.addEventListener('pointermove', e => { if (dragging) moveTo(e); });
  window.addEventListener('pointerup', () => { dragging = false; });
  window.addEventListener('pointercancel', () => { dragging = false; });

  window.addEventListener('resize', draw);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', draw);
  draw();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
